<!DOCTYPE html>
<html>
<head>
<title>Joshua Portfolio</title>
<meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
    * {
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      background-color: black;
    }
    
    /* Style the header */
    .header {
      background-color: black;
      color: white;
      padding: 20px;
      text-align: center;
    }
    
    /* Style the top navigation bar */
    .topnav {
      overflow: hidden;
      background-color:  rgb(151, 16, 16);
    }
    
    /* Style the topnav links */
    .topnav a {
      float: right;
      display: block;
      color: white;
      text-align: center;
      padding: 14px 16px;
      text-decoration: none;
    }
    
    /* Change color on hover */
    .topnav a:hover {
      background-color: rgb(116, 20, 20);
      color: white;
    }
     /* Create three equal columns that floats next to each other */
.column {
  background-color: rgb(58, 58, 58);
  border-color: black;
  float: center;
  color: white;
  width: 38%;
  padding: 15px; 
  border-width: 10px;
  border-style: solid;
  text-align: center;
  margin-left: auto;
  margin-right: auto;
} 
.column2 {
  background-color: rgb(151, 16, 16);
  color: white;
  width: 25%;
  padding: 15px;
  border-color: black;
  border-style: solid;
  border-width: 10px;
  text-align: center;
  margin-left: auto;
  margin-right: auto;
}

/* Clear floats after the columns */
.row::after {
  content: "";
  color: white;
  display: table;
  clear: both;
}

/* Responsive layout - makes the three columns stack on top of each other instead of next to each other */
@media screen and (max-width:600px) {
  .column {
    width: 100%;
  }
}
    </style>
</head>
<body>
    <div class="header">
        <h1>Contact</h1>
      </div>
      
      <div class="topnav">
        <a href="index.html" target="_self">Home</a>
        <a href="Portfolio.html" target="_self">Portfolio</a>
        <a href="About.html" target="_self">About Me</a>
        <a href="Contact.html" target="_self">Contact</a>
      </div>
      <div class="row">
        <div class="column2">
          <h2>Contact Me</h2>
        </div>
        
        <div class="column">
         <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSf3izupBUip3-tfFoTMu-sh1A54U0KefwDI6ew51bSbM3rBRw/viewform?embedded=true" width="640" height="720" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
       </div>
</body>

</html>
